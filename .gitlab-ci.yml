stages:
  - lint
  - test

variables:
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.11-slim

lint_and_syntax:
  stage: lint
  script:
    - python scripts/run_checks.py --syntax-only
    - python scripts/run_checks.py --layout-only

unit_tests:
  stage: test
  script:
    - python scripts/run_checks.py
