[workspace]
resolver = "2"
members = [
    "crates/ln-eclipse-compat",
    "crates/ln-auth",
    "crates/ln-jca",
    "crates/ln-daemon",
    "crates/ln-kb",
    "crates/ln-linter",
    "crates/ln-model",
    "crates/ln-scm",
    "crates/ln-verify",
    "bins/skill-ln",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Skill_LN Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
byteorder = "1.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
url = "2.5"
tokio = { version = "1.40", features = ["full"] }
regex = "1.11"
quick-xml = "0.37"
sha2 = "0.10"
rayon = "1.10"
serde_yaml = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
